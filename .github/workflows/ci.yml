name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: git diff --exit-code packages/blueprint-schema/blueprint.schema.json
      - run: pnpm lint
      - run: pnpm test
      - run: node packages/cli/dist/bin.js validate examples/approvals/blueprint.yaml
