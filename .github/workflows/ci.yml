name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: git diff --exit-code packages/blueprint-schema/blueprint.schema.json
      - run: pnpm lint
      - run: pnpm test
      - run: node packages/cli/dist/bin.js validate examples/approvals/blueprint.yaml
      - run: pnpm goldens:update && git diff --exit-code packages/compiler/test/golden
  infra:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CDK_DISABLE_CLI_TELEMETRY: "true"
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm build
      - run: pnpm vitest run packages/constructs
      - run: pnpm --filter @owninfra/constructs synth
      - run: cmp packages/constructs/cdk.out/spend-approvals-dev.template.json packages/constructs/test/__snapshots__/spend-approvals-dev.template.json
  generated-app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: owninfra
          POSTGRES_PASSWORD: owninfra
          POSTGRES_DB: spend_approvals
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U owninfra" --health-interval 2s --health-retries 30
      # The RDS Data API emulator, so the repository suite also runs the generated app's Data API driver. Local only, no AWS.
      data-api:
        image: koxudaxi/local-data-api@sha256:98aeab6d1cef8b8ff2398d8d435cdd42f0bf3941b8aace021c174d569b8a3376 # 0.6.12
        env:
          ENGINE: PostgreSQLJDBC
          POSTGRES_HOST: postgres
          POSTGRES_PORT: 5432
          POSTGRES_USER: owninfra
          POSTGRES_PASSWORD: owninfra
          RESOURCE_ARN: arn:aws:rds:eu-north-1:000000000000:cluster:local
          SECRET_ARN: arn:aws:secretsmanager:eu-north-1:000000000000:secret:local
        ports: ["8080:80"]
    env:
      DATABASE_URL: postgres://owninfra:owninfra@localhost:5432/spend_approvals
      REPO_TEST_DATABASE_URL: postgres://owninfra:owninfra@localhost:5432/repo_builder
      DATA_API_ENDPOINT: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm build
      - run: psql postgres://owninfra:owninfra@localhost:5432/postgres -c "create database repo_builder"
      - run: pnpm test:pg
      - run: node packages/cli/dist/bin.js init --example approvals "$RUNNER_TEMP/approvals"
      - run: node $GITHUB_WORKSPACE/packages/cli/dist/bin.js generate
        working-directory: ${{ runner.temp }}/approvals
      - run: npm install --no-audit --no-fund
        working-directory: ${{ runner.temp }}/approvals/app
      - run: npx tsc --noEmit && npx eslint . && npx vitest run
        working-directory: ${{ runner.temp }}/approvals/app
      - run: |
          node $GITHUB_WORKSPACE/packages/cli/dist/bin.js generate | tee out.txt
          grep -q "^generate: 0 written" out.txt
        working-directory: ${{ runner.temp }}/approvals
      - run: node $GITHUB_WORKSPACE/packages/cli/dist/bin.js dev --db-only && node $GITHUB_WORKSPACE/packages/cli/dist/bin.js dev --db-only
        working-directory: ${{ runner.temp }}/approvals
      - run: pnpm exec playwright install --with-deps chromium
      - name: Width, console and API checks against the running app
        run: |
          (cd "$RUNNER_TEMP/approvals/app" && OWNINFRA_AUTH_STUB=1 AUTH_SECRET=ci-only nohup npx next dev -p 3217 > /tmp/owninfra-next.log 2>&1 &)
          for i in $(seq 1 120); do curl -sf http://localhost:3217/api/auth/csrf > /dev/null && break; sleep 1; done
          PW_CHANNEL=chromium node e2e/widths.mjs || { tail -50 /tmp/owninfra-next.log; exit 1; }
      - run: |
          if OWNINFRA_AUTH_STUB=1 npx next build; then echo "stub build must fail"; exit 1; fi
          npx next build
        working-directory: ${{ runner.temp }}/approvals/app
  # `owninfra smoke` on a fresh approvals project, once over TCP and once through the Data API emulator. No secrets, no AWS.
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: owninfra
          POSTGRES_PASSWORD: owninfra
          POSTGRES_DB: smoke_builder
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U owninfra" --health-interval 2s --health-retries 30
      data-api:
        image: koxudaxi/local-data-api@sha256:98aeab6d1cef8b8ff2398d8d435cdd42f0bf3941b8aace021c174d569b8a3376 # 0.6.12
        env:
          ENGINE: PostgreSQLJDBC
          POSTGRES_HOST: postgres
          POSTGRES_PORT: 5432
          POSTGRES_USER: owninfra
          POSTGRES_PASSWORD: owninfra
          RESOURCE_ARN: arn:aws:rds:eu-north-1:000000000000:cluster:local
          SECRET_ARN: arn:aws:secretsmanager:eu-north-1:000000000000:secret:local
        ports: ["8080:80"]
    env:
      DATABASE_URL: postgres://owninfra:owninfra@localhost:5432/smoke_builder
      CDK_DISABLE_CLI_TELEMETRY: "true"
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm build
      - run: node packages/cli/dist/bin.js init --example approvals "$RUNNER_TEMP/approvals"
      - run: node $GITHUB_WORKSPACE/packages/cli/dist/bin.js generate
        working-directory: ${{ runner.temp }}/approvals
      - run: node $GITHUB_WORKSPACE/packages/cli/dist/bin.js smoke --port 3021
        working-directory: ${{ runner.temp }}/approvals
      - run: node $GITHUB_WORKSPACE/packages/cli/dist/bin.js smoke --port 3021 --data-api http://localhost:8080
        working-directory: ${{ runner.temp }}/approvals
      # A second, unrelated blueprint: only the generic steps and per-entity CRUD apply.
      - run: mkdir "$RUNNER_TEMP/assets" && cp packages/cli/test/fixtures/smoke/assets.yaml "$RUNNER_TEMP/assets/blueprint.yaml"
      - run: node $GITHUB_WORKSPACE/packages/cli/dist/bin.js generate
        working-directory: ${{ runner.temp }}/assets
      - run: node $GITHUB_WORKSPACE/packages/cli/dist/bin.js smoke --port 3022
        working-directory: ${{ runner.temp }}/assets
      - run: node $GITHUB_WORKSPACE/packages/cli/dist/bin.js smoke --port 3022 --data-api http://localhost:8080
        working-directory: ${{ runner.temp }}/assets
